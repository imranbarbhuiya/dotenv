[package]
name = "dotenv-rs-fast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast dotenv parser, variable expander, loader, and CLI"
license = "MIT"
repository = "https://github.com/imranbarbhuiya/dotenv"
readme = "README.md"
keywords = ["dotenv", "env", "parser", "configuration"]
categories = ["config", "parser-implementations"]

[lib]
name = "dotenv"

[[bin]]
name = "dotenv-bench-driver"
path = "src/bin/benchmark_driver.rs"

[[bin]]
name = "dotenv"
path = "src/main.rs"

[dependencies]
dotenvx-primitives = "=2.2.0"
indexmap = "2.11"

[dev-dependencies]
criterion = "0.7"
tempfile = "3.22"
dotenv-upstream = { package = "dotenv", version = "=0.15.0" }
dotenv-ng-upstream = { package = "dotenv-ng", version = "=1.0.0", default-features = false }

[[bench]]
name = "parser"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
lto = "thin"
codegen-units = 1
